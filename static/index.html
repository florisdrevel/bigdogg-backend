    }
    @keyframes bd-spin {
      to { transform: rotate(360deg); }
    }

<body>
  <div id="app-loader">
    <img src="icons/Icon-512.png" alt="BigDogg" />
    <div class="spinner"></div>
  </div>
  <script>
    // Fade out the splash once Flutter has rendered its first frame.
    // Fallback: hard-remove after 8s in case the event never fires.
    (function () {
      var loader = document.getElementById('app-loader');
      if (!loader) return;
      var hide = function () {
        if (!loader || loader.classList.contains('fade-out')) return;
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      };
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 8000);
    })();
  </script>
